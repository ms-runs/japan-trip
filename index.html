<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Japan trip planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c1917;--paper:#f6f1e9;--paper2:#ede8de;--line:rgba(28,25,23,.12);--line2:rgba(28,25,23,.22);--muted:#6c655e;
  --land:#ece6d8;--coast:#bfb49c;--sea:#bcd5e1;--accent:#1b4878;--ok:#1a6b3c;--warn:#a16207;--bad:#b42318;}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.45 'DM Sans',system-ui,sans-serif;color:var(--ink);background:var(--paper);display:flex;flex-direction:column;height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{border:1px solid var(--line2);border-radius:5px;background:#fff;padding:6px 8px;font-size:12.5px}

header{display:flex;align-items:center;gap:14px;padding:9px 16px;background:var(--ink);color:var(--paper);flex-wrap:wrap}
.logo{font:600 18px 'Shippori Mincho',serif;letter-spacing:.03em}
.logo small{opacity:.45;font-size:12px;margin-left:6px}
#trip-summary{font:600 15px 'Shippori Mincho',serif}
#trip-summary small{font:400 11px 'DM Sans',sans-serif;opacity:.6;margin-left:6px}
#status{font-size:11px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.1)}
#status[data-kind=synced]{background:#1f4d33}
#status[data-kind=offline]{background:#6b4a0c}
#status[data-kind=error]{background:#7a1f16}
.tools{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.tools button{background:none;border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--paper)}
.tools button:hover{background:rgba(255,255,255,.08)}
.tools button[aria-pressed=true]{background:#3a6e9a;border-color:#3a6e9a}
#checks-btn[data-state=fail]::after,#checks-btn[data-state=warn]::after{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:#f87171;margin-left:6px}
#checks-btn[data-state=warn]::after{background:#fbbf24}

.app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(330px,410px) 1fr}
.sidebar{overflow-y:auto;border-right:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--paper2);font-size:12px;color:var(--muted)}
.bar input{flex:1;min-width:0;font-size:13px}
.paste{flex-direction:column;align-items:stretch;gap:4px}
.paste label{font-weight:500;color:var(--ink)}

.leg{border-bottom:1px solid var(--line);background:#faf8f3}
.leg-head{display:flex;align-items:center;gap:10px;width:100%;padding:8px 16px;border:0;background:none;text-align:left}
.leg-head:hover{background:var(--paper2)}
.leg-icon{width:22px;text-align:center}
.leg-text{flex:1;min-width:0;display:flex;flex-direction:column;font-size:11px;color:var(--muted)}
.leg-text b{font-weight:500;color:var(--ink);font-size:12px}
.badge{font-size:10px;padding:2px 7px;border-radius:99px;background:#efe9dc;color:#7c705a;white-space:nowrap}
.badge.on{background:#d9f0e1;color:var(--ok)}
.leg-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 16px 14px}
.leg-form label,.notes{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:500;color:var(--muted)}
.leg-form .full{grid-column:1/-1}
.link{grid-column:1/-1;justify-self:start;border:0;background:none;color:var(--muted);text-decoration:underline;font-size:11px}

.stop{border-bottom:1px solid var(--line);border-left:3px solid transparent}
.stop.open{background:#efece3;border-left-color:var(--c)}
.stop.hover{background:#e7eef6}
.stop-head{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer}
.num{width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 12px 'Shippori Mincho',serif;flex-shrink:0}
.s-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.s-name{font:600 15.5px 'Shippori Mincho',serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-sub{font-size:11px;color:var(--muted)}
.s-sub em{font-style:normal;color:#7d6f4e;font-weight:500;margin-left:4px}
.name-in{font:600 14px 'Shippori Mincho',serif;padding:3px 6px}
.region-in{font-size:11px;padding:2px 6px}
.nights{display:flex;align-items:center;flex-shrink:0}
.nights button{width:24px;height:26px;border:1px solid var(--line2);background:var(--paper)}
.nights button:first-child{border-radius:5px 0 0 5px}
.nights button:last-child{border-radius:0 5px 5px 0}
.nights input{width:34px;height:26px;border-radius:0;border-width:1px 0;padding:0;text-align:center;font:600 13px 'Shippori Mincho',serif;background:var(--paper);-moz-appearance:textfield}
.nights input::-webkit-inner-spin-button{display:none}
.edit-ctl{display:flex;gap:2px}
.edit-ctl button{width:24px;height:26px;border:1px solid var(--line2);border-radius:5px;background:var(--paper);font-size:10px;color:var(--muted)}
.edit-ctl button:disabled{opacity:.35;cursor:default}
.stop-body{padding:0 16px 16px 52px}
.stop-body h4{font:600 12px 'DM Sans',sans-serif;color:var(--muted);margin:12px 0 6px}
.things{list-style:none;display:flex;flex-direction:column;gap:5px}
.things li{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 6px;font-size:13px}
.things li::before{content:'';width:5px;height:5px;border-radius:50%;background:#c0b8b0;transform:translateY(-2px)}
.things li.hl{font-weight:500}
.things li.hl::before{background:var(--c)}
.things li span{flex:1 1 60%}
.tag{font-style:normal;font-size:9.5px;padding:1px 6px;border-radius:4px}
.places{list-style:none;display:flex;flex-direction:column;gap:8px}
.places li{background:#fff;border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.pl-top{display:flex;align-items:center;gap:6px}
.pl-top a{flex:1;min-width:0;font-weight:500;color:var(--accent);text-decoration:none;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.pl-top a:hover{text-decoration:underline}
.pl-top select{font-size:11px;padding:2px 4px;max-width:118px}
.x{border:0;background:none;color:var(--muted);width:24px;height:24px;border-radius:4px;flex-shrink:0}
.x:hover{background:#fde8e6;color:var(--bad)}
.pl-note{width:100%;margin-top:6px;border:0;border-top:1px dashed var(--line2);border-radius:0;padding:6px 0 0;font-size:12.5px;background:transparent}
.tip{margin-top:12px;padding:8px 10px;border-left:2px solid #c9a84c;background:#fdf8ec;font-size:12px;color:#6b5000}
.notes{margin-top:12px}
.notes textarea{resize:vertical;min-height:48px}
.add-stop{display:block;margin:16px;width:calc(100% - 32px);padding:10px;border:1.5px dashed var(--line2);border-radius:8px;background:none;color:var(--muted)}
.add-stop:hover{border-color:var(--accent);color:var(--accent)}

.map{position:relative;overflow:hidden;background:var(--sea);touch-action:none;display:flex;flex-direction:column}
#map{flex:1;min-height:0;width:100%;display:block;cursor:grab}
#map.dragging{cursor:grabbing}
#land path{fill:var(--land);stroke:var(--coast);stroke-width:.6;vector-effect:non-scaling-stroke}
#pins [data-sid],#places [data-sid]{cursor:pointer}
.playbar{margin:10px 12px 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:7px 11px;background:rgba(255,255,255,.95);border-radius:9px;box-shadow:0 2px 10px rgba(0,0,0,.12);font-size:12px}
.playbar button,.zoom button{min-width:28px;height:28px;border:1px solid var(--line2);border-radius:6px;background:var(--paper)}
#play[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
#day{flex:1;min-width:40px;accent-color:var(--accent);padding:0;border:0;background:none}
#day-label{min-width:0;max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:4px}
.zoom button{padding:0 9px;font-size:12px}
.legend{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.95);border-radius:8px;padding:8px 11px;font-size:11px;display:flex;flex-direction:column;gap:3px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.legend i.dot{width:8px;height:8px;border-radius:50%;margin:0 10px 0 4px;background:#888;border:1.5px solid #fff}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);padding:6px 10px;border-radius:6px;font-size:12px;transform:translate(-50%,calc(-100% - 14px));opacity:0;transition:opacity .1s;white-space:nowrap}
#tip.on{opacity:1}
@keyframes bob{50%{transform:translateY(-4px)}}
.bob{animation:bob .9s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob{animation:none}}

dialog{margin:auto;border:0;border-radius:12px;padding:20px;width:min(460px,92vw);background:var(--paper);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(28,25,23,.45)}
dialog h3{font:600 18px 'Shippori Mincho',serif}
dialog form{display:flex;flex-direction:column;gap:10px}
dialog label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--muted)}
dialog textarea.json{min-height:200px;font:11px ui-monospace,monospace}
.muted{color:var(--muted);font-size:12.5px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.actions button{padding:7px 14px;border-radius:6px;border:1px solid var(--line2);background:var(--paper)}
.actions .primary{background:var(--accent);border-color:var(--accent);color:#fff}
.checks{list-style:none;display:flex;flex-direction:column;gap:7px;max-height:58vh;overflow:auto}
.checks li{display:grid;grid-template-columns:18px 1fr;gap:1px 8px;font-size:12.5px}
.checks li::before{font-weight:700;text-align:center}
.checks .pass::before{content:'✓';color:var(--ok)}
.checks .warn::before{content:'!';color:var(--warn)}
.checks .fail::before{content:'✕';color:var(--bad)}
.checks .info::before{content:'i';color:var(--muted)}
.checks small{grid-column:2;color:var(--muted)}
#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,16px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:7px;font-size:12.5px;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:46vh 1fr}
  .map{order:-1}
  .sidebar{border-right:0;border-top:1px solid var(--line)}
  .legend{display:none}
  header{gap:6px 10px;padding:8px 12px}
  .logo small{display:none}
  .tools{margin-left:0;width:100%;flex-wrap:nowrap;overflow-x:auto}
  .tools button{white-space:nowrap}
  #day-label{max-width:none;flex-basis:100%}
}
</style>
</head>
<body>
<header>
  <div class="logo">Japan trip<small>日本の旅</small></div>
  <div id="trip-summary"></div>
  <div id="status" data-kind="local" role="status"></div>
  <div class="tools">
    <button id="edit-btn" data-action="toggle-edit" aria-pressed="false">Edit stops</button>
    <button id="checks-btn" data-action="checks">Checks</button>
    <button data-action="copy">Copy plan</button>
    <button data-action="import">Load plan</button>
    <button data-action="reset">Reset</button>
  </div>
</header>

<div class="app">
  <aside class="sidebar">
    <div class="bar">
      <span>Start date</span>
      <input type="date" id="start-date" data-bind="startDate" data-rerender style="flex:0 1 auto">
      <span id="end-date"></span>
    </div>
    <div class="bar paste">
      <label for="paste-in">Add a place</label>
      <input id="paste-in" placeholder="Paste a Google Maps link, then press Enter" autocomplete="off">
    </div>
    <div id="stops"></div>
    <button class="add-stop" data-action="add-stop">+ Add a stop</button>
  </aside>

  <main class="map">
    <div class="playbar">
      <button data-action="step" data-d="-1" aria-label="Previous day">‹</button>
      <button id="play" data-action="play" aria-pressed="false" aria-label="Play through the trip">▶</button>
      <input type="range" id="day" min="1" max="1" value="1" aria-label="Trip day">
      <button data-action="step" data-d="1" aria-label="Next day">›</button>
      <span id="day-label">Scrub through the trip day by day</span>

function normalize(t) {
  if (!t || !Array.isArray(t.stops) || !t.stops.length) return null;
  t.stops.forEach((s, i) => {
    if (s.tabs && !s.sections) s.sections = s.tabs.map(tb => ({label: tb.label, items: tb.items || []}));
    ['tabs','skiPicker','skiOptions','skiChoice','num','days'].forEach(k => delete s[k]);
    s.id ||= uid(); s.sections ||= []; s.places ||= []; s.notes ??= ''; s.tip ??= ''; s.prefIds ||= [];
    s.color ||= PALETTE[i % PALETTE.length];
    s.nights = clamp(parseInt(s.nights) || 1, 1, 30);
    if (i === 0) delete s.leg; else s.leg = {...leg('train'), ...(s.leg || {})};

}

const STATUS = {local:'Saved in this browser', saving:'Saving…', offline:'Offline — saved here, will sync', error:'Could not save — browser storage is blocked'};
function setStatus(kind, text) {

}
function writeLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(trip)); return true; } catch { setStatus('error'); return false; } }

// Every change goes through save(): stored locally at once, and pushed to the shared copy shortly after.
function save() {

  if (!writeLocal()) return;
  if (!REMOTE) return setStatus('local');
  sync.dirty = true; writeSync(); setStatus('saving');
  clearTimeout(sync.timer); sync.timer = setTimeout(push, 700);
}

function rpc(fn, body) {
  const headers = {'Content-Type':'application/json', apikey: CONFIG.supabaseKey};
  if (CONFIG.supabaseKey.startsWith('eyJ')) headers.Authorization = 'Bearer ' + CONFIG.supabaseKey; // legacy JWT-style anon keys
  return fetch(`${CONFIG.supabaseUrl.replace(/\/$/, '')}/rest/v1/rpc/${fn}`, {method:'POST', headers, body: JSON.stringify(body)})
    .then(async r => { if (!r.ok) throw new Error(`${r.status} ${await r.text()}`); return r.json(); });
}

}
async function push() {
  sync.timer = null;
  if (sync.busy) { sync.again = true; return; }
  sync.busy = true;
  try {
    const [r] = await rpc('save_trip', {p_key: TRIP_KEY, p_data: trip, p_base: sync.base});
    if (r.ok) { sync.base = r.saved_at; sync.dirty = false; writeSync(); setStatus('synced'); }
    else { sync.again = false; adopt(r); toast('Someone else saved at the same moment. Their version is loaded — please redo your last change.'); }
  } catch (e) { console.warn(e); setStatus('offline'); }
  sync.busy = false;
  if (sync.again) { sync.again = false; push(); }
}
const isTyping = () => document.activeElement?.matches('input,textarea,select') || $('dialog[open]');
async function poll() {
  if (!REMOTE || sync.busy || sync.timer || isTyping()) return;
  if (sync.dirty) return push();
  try {
    const [row] = await rpc('get_trip', {p_key: TRIP_KEY});
    if (row && row.saved_at !== sync.base) { adopt(row); toast('Loaded the latest changes from your group.'); }
    else setStatus('synced');
  } catch { setStatus('offline'); }
}
async function initRemote() {
  setStatus('saving', 'Connecting…');
  try {
    const [row] = await rpc('get_trip', {p_key: TRIP_KEY});
    if (!row) { sync.base = null; await push(); }                           // first person: upload this plan
    else if (sync.dirty && sync.base === row.saved_at) await push();         // our offline edits are the newest
    else { if (sync.dirty) toast('Newer shared changes replaced edits made while offline.'); adopt(row); }
  } catch (e) { console.warn(e); setStatus('offline'); }
  setInterval(poll, 15000);
  addEventListener('focus', poll);
}

const MAPS_RE = /(google\.[a-z.]+\/maps|maps\.google\.|maps\.app\.goo\.gl|goo\.gl\/maps)/i;
// Reads a place name and coordinates out of pasted text. Works on full links; short
// maps.app.goo.gl links hide the location until expanded (browser can't; see resolverUrl).
function parseMapsText(text) {
  const url = (String(text).match(/https?:\/\/[^\s<>"]+/) || [''])[0];
  const out = {url, name: String(text).replace(url, '').trim().split('\n')[0].trim(), lat: null, lng: null, short: false};
  if (!url) return out;
  if (/^https?:\/\/(maps\.app\.goo\.gl|goo\.gl\/maps)\//i.test(url)) { out.short = true; return out; }
  let d; try { d = decodeURIComponent(url.replace(/\+/g, ' ')); } catch { d = url; }
  const n = '(-?\\d{1,3}\\.\\d+)';
  const m = d.match(new RegExp(`!3d${n}!4d${n}`))                                // exact pin
        || d.match(new RegExp(`[?&](?:q|query|ll|center|destination)=${n},\\s*${n}`)) // coordinates in the query
        || d.match(new RegExp(`@${n},${n}`));                                     // map view centre
  if (m) { out.lat = +m[1]; out.lng = +m[2]; }
  const place = d.match(/\/maps\/place\/([^/@?]+)/) || d.match(/[?&](?:q|query)=([^&]+)/);
  if (place && !/^\s*-?\d+\.\d+\s*,/.test(place[1])) out.name = place[1].trim() || out.name;

}
async function expandShort(p) {
  if (!p.short || !CONFIG.resolverUrl) return p;

    const q = parseMapsText(full);

  } catch { return p; }
}

// Where each pin is drawn: its true spot, nudged outward if it would cover an earlier pin.
function pinPositions(k) {
  const placed = [];
  return trip.stops.map(s => {
    const [tx, ty] = project(s.lat, s.lng); let x = tx, y = ty;
    for (let t = 0; t < 30 && placed.some(([px, py]) => Math.hypot(px - x, py - y) < 20*k); t++) {
      const a = t*2.4, r = 20*k*(1 + t/6); x = tx + Math.cos(a)*r; y = ty + Math.sin(a)*r;
    }
    placed.push([x, y]);
    return {x, y, tx, ty};
  });
}

  const k = Math.max(ui.view[2]/(svg.clientWidth || MAP_W), ui.view[3]/(svg.clientHeight || MAP_H)), pos = pinPositions(k);  // map units per screen pixel
  let routes = '';
  for (let i = 1; i < trip.stops.length; i++) {
    const L = trip.stops[i].leg, m = MODES[L.mode] || MODES.train, a = pos[i - 1], b = pos[i], booked = isBooked(L);
    const bend = L.mode === 'flight' ? 0.2 : 0, cx = (a.x + b.x)/2 - (b.y - a.y)*bend, cy = (a.y + b.y)/2 + (b.x - a.x)*bend;
    const mx = (a.x + 2*cx + b.x)/4, my = (a.y + 2*cy + b.y)/4, deg = Math.atan2(b.y - a.y, b.x - a.x)*180/Math.PI;

    if (Math.hypot(b.x - a.x, b.y - a.y) > 70*k)
      routes += `<text x="${mx}" y="${my - 9*k}" font-size="${10*k}" font-weight="600" text-anchor="middle" fill="${m.color}" stroke="#fff" stroke-width="${3*k}" paint-order="stroke">${esc(m.icon + ' ' + (L.number || L.est))}</text>`;

    const [x, y] = project(p.lat, p.lng);
    return `<g data-sid="${s.id}" data-tip="${esc(p.name)} (${esc(s.name)})"><circle cx="${x}" cy="${y}" r="${5*k}" fill="${esc(s.color)}" stroke="#fff" stroke-width="${1.5*k}"/>`
      + (k < 0.5 ? `<text x="${x + 8*k}" y="${y}" font-size="${11*k}" font-weight="500" dominant-baseline="central" fill="#1c1917" stroke="#fff" stroke-width="${3*k}" paint-order="stroke">${esc(p.name)}</text>` : '') + '</g>';
  })).join('');

  const info = ui.showDay ? dayInfo(ui.day) : null;
  $('#pins').innerHTML = trip.stops.map((s, i) => {
    const p = pos[i], active = ui.openStop === s.id, r = (active ? 11 : 9)*k, moved = Math.hypot(p.x - p.tx, p.y - p.ty) > 1;
    return `<g data-sid="${s.id}" data-tip="${i + 1}. ${esc(s.name)}, ${s.nights} night${s.nights > 1 ? 's' : ''}">
      ${moved ? `<line x1="${p.tx}" y1="${p.ty}" x2="${p.x}" y2="${p.y}" stroke="${esc(s.color)}" stroke-width="${1.2*k}"/><circle cx="${p.tx}" cy="${p.ty}" r="${2.2*k}" fill="${esc(s.color)}"/>` : ''}
      <circle cx="${p.x + k}" cy="${p.y + 2*k}" r="${r}" fill="rgba(0,0,0,.2)"/>
      <circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${esc(s.color)}" stroke="#fff" stroke-width="${(active ? 2.5 : 2)*k}"/>
      <text x="${p.x}" y="${p.y}" font-size="${(active ? 10.5 : 9.5)*k}" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central" font-family="Shippori Mincho,serif">${i + 1}</text>
    </g>`;
  }).join('') + (info ? dayMarker(info, pos, k) : '');
}
function dayMarker(info, pos, k) {
  const p = pos[info.i];
  let out = '';
  if (info.travel) {
    const a = pos[info.i - 1], m = MODES[info.s.leg.mode] || MODES.train;
    out += `<g transform="translate(${(a.x + p.x)/2} ${(a.y + p.y)/2})"><circle r="${13*k}" fill="${m.color}" stroke="#fff" stroke-width="${2*k}"/><text font-size="${13*k}" text-anchor="middle" dominant-baseline="central">${m.icon}</text></g>`;
  }
  return out + `<g transform="translate(${p.x} ${p.y - 24*k})"><g class="bob"><circle r="${9.5*k}" fill="#f2b705" stroke="#1c1917" stroke-width="${1.6*k}"/><text font-size="${10*k}" font-weight="700" text-anchor="middle" dominant-baseline="central">${info.i + 1}</text></g></g>`;
}
function renderMap() { renderLand(); renderOverlay(); }

// Zoom and pan
function clampView(v) {
  const w = clamp(v[2], 110, MAP_W), h = w*MAP_H/MAP_W;
  return [clamp(v[0], -w/2, MAP_W - w/2), clamp(v[1], -h/2, MAP_H - h/2), w, h];
}
function setView(target) {
  target = clampView(target);
  const from = [...ui.view], t0 = performance.now();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { ui.view = target; return renderOverlay(); }
  const step = t => { const q = Math.min(1, (t - t0)/320), e = 1 - (1 - q)**3; ui.view = from.map((v, i) => v + (target[i] - v)*e); renderOverlay(); if (q < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function viewAround(points, minW = 170) {
  const xs = points.map(p => p[0]), ys = points.map(p => p[1]);
  const w = Math.max(minW, (Math.max(...xs) - Math.min(...xs))*1.3, (Math.max(...ys) - Math.min(...ys))*1.3*MAP_W/MAP_H), h = w*MAP_H/MAP_W;
  return [(Math.min(...xs) + Math.max(...xs))/2 - w/2, (Math.min(...ys) + Math.max(...ys))/2 - h/2, w, h];
}
const fitAll = () => setView(viewAround(trip.stops.map(s => project(s.lat, s.lng)), MAP_W*.5));
function zoomToStop(id) {
  const s = trip.stops.find(x => x.id === id); if (!s) return;
  setView(viewAround([project(s.lat, s.lng), ...s.places.filter(p => p.lat != null).map(p => project(p.lat, p.lng))]));
}
function zoomBy(f, [px, py] = [ui.view[0] + ui.view[2]/2, ui.view[1] + ui.view[3]/2]) {
  const [x, y, w, h] = ui.view, nw = clamp(w*f, 110, MAP_W); f = nw/w;
  ui.view = clampView([px - (px - x)*f, py - (py - y)*f, w*f, h*f]); renderOverlay();
}
function svgPoint(e) { const svg = $('#map'), pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const r = pt.matrixTransform(svg.getScreenCTM().inverse()); return [r.x, r.y]; }

// ═══ 11. DAY-BY-DAY PLAYBACK ══════════════════════════════════════════════════
function renderPlayback() {
  const total = totalNights(), slider = $('#day');
  ui.day = clamp(ui.day, 1, total); slider.max = total; slider.value = ui.day;
  if (!ui.showDay) return;
  const info = dayInfo(ui.day), d = dateAt(ui.day - 1);
  $('#day-label').textContent = `Day ${ui.day} of ${total}${d ? `, ${fmt(d)}` : ''}: ${info.s.name}${info.travel ? ', travel day' : `, night ${info.night} of ${info.s.nights}`}`;
}
function goToDay(d) {
  ui.day = clamp(d, 1, totalNights()); ui.showDay = true;
  const info = dayInfo(ui.day); ui.openStop = info.s.id;
  renderStops(); renderMap(); renderPlayback();
  document.querySelector(`[data-sid="${info.s.id}"]`)?.scrollIntoView({block:'nearest', behavior:'smooth'});
}
function togglePlay() {
  const btn = $('#play');
  if (ui.playing) { clearInterval(ui.playing); ui.playing = null; btn.textContent = '▶'; btn.setAttribute('aria-pressed', 'false'); return; }
  if (ui.day >= totalNights()) ui.day = 0;
  btn.textContent = '❚❚'; btn.setAttribute('aria-pressed', 'true');
  goToDay(ui.day + 1);
  ui.playing = setInterval(() => ui.day >= totalNights() ? togglePlay() : goToDay(ui.day + 1), 1400);
}

// ═══ 12. ACTIONS AND EVENTS ═══════════════════════════════════════════════════
function renderAll() { renderHeader(); renderStops(); renderMap(); renderPlayback(); }
const byId = id => trip.stops.find(s => s.id === id);

const ACTIONS = {
  'toggle-stop': d => { ui.openStop = ui.openStop === d.id ? null : d.id; renderStops(); renderMap(); if (ui.openStop) zoomToStop(d.id); },
  'toggle-leg': d => { ui.openLeg = ui.openLeg === d.id ? null : d.id; renderStops(); },
  'nights': d => { const s = byId(d.id); s.nights = clamp(s.nights + +d.d, 1, 30); save(); renderAll(); },
  'move': d => { const a = trip.stops, i = a.findIndex(s => s.id === d.id), j = i + +d.d; [a[i], a[j]] = [a[j], a[i]]; save(); renderAll(); toast('Moved. Check the travel details either side of it.'); },
  'delete-stop': d => { const s = byId(d.id); if (trip.stops.length < 2 || !confirm(`Remove ${s.name}${s.places.length ? ` and its ${s.places.length} saved places` : ''}?`)) return; trip.stops = trip.stops.filter(x => x !== s); save(); renderAll(); },
  'clear-leg': d => { const s = byId(d.id); s.leg = leg(s.leg.mode, s.leg.est); save(); renderStops(); renderMap(); },
  'delete-place': d => { const s = byId(d.id); s.places = s.places.filter(p => p.id !== d.pid); save(); renderAll(); },
  'toggle-edit': () => { ui.edit = !ui.edit; renderHeader(); renderStops(); },
  'add-stop': () => { $('#paste-in').focus(); toast('Paste a Google Maps link for the new stop, then choose “New stop at this place”.'); },
  'step': d => goToDay((ui.showDay ? ui.day : 0) + +d.d),
  'play': () => togglePlay(),
  'zoom': d => zoomBy(+d.f),
  'fit': () => fitAll(),
  'copy': () => navigator.clipboard.writeText(JSON.stringify(trip, null, 1)).then(() => toast('Plan copied. Paste it into a chat with Claude to have the file updated.'), () => toast('Copy was blocked by the browser.')),
  'import': () => { $('#import-text').value = ''; openDlg('#import-dlg'); },
  'reset': () => { if (!confirm(`Go back to the built-in plan?${REMOTE ? ' This changes it for everyone sharing the plan.' : ''} Your edits will be lost.`)) return; trip = structuredClone(DEFAULT_TRIP); ui.openStop = ui.openLeg = null; save(); renderAll(); fitAll(); },
  'checks': () => showChecks(),
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.tagName === 'SELECT') return;
  if (e.target.closest('input,select,textarea') && el !== e.target) return;   // typing in a field inside a clickable header
  ACTIONS[el.dataset.action]?.(el.dataset, el);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button]')) { e.preventDefault(); e.target.click(); }
});
// Any field with data-bind saves itself as you type.
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset.bind) return;
  let v = t.value;
  if ('int' in t.dataset) { v = parseInt(v); if (!(v >= 1)) return; v = Math.min(v, 30); }
  setPath(t.dataset.bind, v); save();
  if (t.dataset.bind === 'startDate') renderAll();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.action === 'move-place') {
    const from = byId(t.dataset.id), to = byId(t.value), pl = from.places.find(p => p.id === t.dataset.pid);
    from.places = from.places.filter(p => p !== pl); to.places.push(pl); save(); renderAll();
    return toast(`Moved ${pl.name} to ${to.name}.`);
  }
  if ('rerender' in t.dataset) renderAll();
});
// Pasting: a Maps link pasted anywhere (outside a text field) opens the add-place dialog.
document.addEventListener('paste', e => {
  const text = e.clipboardData.getData('text'), t = e.target;
  if (t.id === 'paste-in' || (!t.closest?.('input,textarea') && MAPS_RE.test(text))) { e.preventDefault(); t.id === 'paste-in' && (t.value = ''); openPlaceDialog(text); }
});
$('#paste-in').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.value.trim()) { openPlaceDialog(e.target.value); e.target.value = ''; } });
$('#place-dlg').addEventListener('close', e => { if (e.target.returnValue === 'add') addPlace(); ui.pending = null; });
$('#import-dlg').addEventListener('close', e => {
  if (e.target.returnValue !== 'load') return;
  let t; try { t = normalize(JSON.parse($('#import-text').value)); } catch {}
  if (!t) return toast('That isn’t plan text. Use “Copy plan” to get it, then paste it here.');
  trip = t; ui.openStop = ui.openLeg = null; save(); renderAll(); fitAll(); toast('Plan loaded.');
});
$('#day').addEventListener('input', e => goToDay(+e.target.value));

// Map: hover, click, wheel zoom, drag to pan
const svgEl = $('#map'), tipEl = $('#tip');
let hoverSid = null, drag = null;
svgEl.addEventListener('mousemove', e => {
  const t = e.target.closest('[data-tip]'), sid = t?.dataset.sid || null;
  if (t) { const r = $('.map').getBoundingClientRect(); tipEl.textContent = t.dataset.tip; tipEl.style.left = (e.clientX - r.left) + 'px'; tipEl.style.top = (e.clientY - r.top) + 'px'; }
  tipEl.classList.toggle('on', Boolean(t));
  if (sid !== hoverSid) { hoverSid = sid; $$('.stop').forEach(el => el.classList.toggle('hover', el.dataset.sid === sid)); }
});
svgEl.addEventListener('mouseleave', () => { tipEl.classList.remove('on'); hoverSid = null; $$('.stop.hover').forEach(el => el.classList.remove('hover')); });
svgEl.addEventListener('click', e => {
  const sid = e.target.closest('[data-sid]')?.dataset.sid; if (!sid) return;
  ui.openStop = sid; renderStops(); renderMap(); zoomToStop(sid);
  document.querySelector(`.stop[data-sid="${sid}"]`)?.scrollIntoView({block:'nearest', behavior:'smooth'});
});
svgEl.addEventListener('wheel', e => { e.preventDefault(); zoomBy(e.deltaY < 0 ? 0.85 : 1.18, svgPoint(e)); }, {passive:false});
svgEl.addEventListener('pointerdown', e => { if (e.target.closest('[data-sid]')) return; drag = {x: e.clientX, y: e.clientY, v: [...ui.view]}; svgEl.setPointerCapture(e.pointerId); svgEl.classList.add('dragging'); });
svgEl.addEventListener('pointermove', e => {
  if (!drag) return;
  const u = Math.max(drag.v[2]/svgEl.clientWidth, drag.v[3]/svgEl.clientHeight);   // map units per screen pixel
  ui.view = clampView([drag.v[0] - (e.clientX - drag.x)*u, drag.v[1] - (e.clientY - drag.y)*u, drag.v[2], drag.v[3]]);
  renderOverlay();
});
['pointerup','pointercancel'].forEach(t => svgEl.addEventListener(t, () => { drag = null; svgEl.classList.remove('dragging'); }));

// ═══ 13. CHECKS — runs on load; open with the "Checks" button ═════════════════
async function runChecks() {
  const R = [], add = (state, name, detail = '') => R.push({state, name, detail});

  const paths = $$('#land path');
  add(paths.length === 47 ? 'pass' : 'fail', 'Map of Japan loaded', `${paths.length} of 47 prefectures`);
  const err = Math.max(...MAP_REF.map(([la, ln, x, y]) => { const [px, py] = project(la, ln); return Math.hypot(px - x, py - y); }));
  add(err < 1 ? 'pass' : 'fail', 'Pins are positioned with the map’s own projection', `largest error ${err.toFixed(2)} px against the map’s reference points`);

  trip.stops.forEach((s, i) => {
    const [x, y] = project(s.lat, s.lng), name = `${i + 1}. ${s.name} is in the right place`;
    if (!(x >= 0 && x <= MAP_W && y >= 0 && y <= MAP_H)) return add('fail', name, 'the pin falls outside the map');
    const hit = prefAt(x, y), near = hit || prefAt(x, y, 6), ok = p => p && (!s.prefIds.length || s.prefIds.includes(p.id));
    if (ok(hit)) add('pass', name, `in ${hit.getAttribute('name')}`);
    else if (ok(near)) add('warn', name, `just off the coast of ${near.getAttribute('name')}`);
    else add('fail', name, hit ? `lands in ${hit.getAttribute('name')}, expected ${s.prefIds.map(prefName).join(' or ')}` : 'lands in the sea');
  });

  const bad = trip.stops.filter(s => !Number.isInteger(s.nights) || s.nights < 1);
  add(bad.length ? 'fail' : 'pass', 'Every stop has at least one night', bad.length ? bad.map(s => s.name).join(', ') : `${totalNights()} nights across ${trip.stops.length} stops`);
  add(!trip.stops[0].leg && trip.stops.slice(1).every(s => MODES[s.leg?.mode]) ? 'pass' : 'fail', 'Every move between stops has a travel leg');
  add(new Set(trip.stops.map(s => s.id)).size === trip.stops.length ? 'pass' : 'fail', 'Stops are uniquely identified');

  if (trip.startDate) {
    const clash = trip.stops.slice(1).map((s, j) => ({s, want: ymd(dateAt(nightsBefore(j + 1)))})).filter(({s, want}) => s.leg.depDate && s.leg.depDate !== want);
    add(clash.length ? 'warn' : 'pass', 'Booked travel dates match the plan',
      clash.length ? clash.map(({s, want}) => `${s.name}: booked ${s.leg.depDate}, plan moves on ${want}`).join('; ') : `trip runs ${fmt(dateAt(0))} to ${fmt(dateAt(totalNights()))}`);
  } else add('info', 'Booked travel dates match the plan', 'add a start date to check these');

  const places = trip.stops.flatMap(s => s.places.map(p => ({s, p})));
  const far = places.filter(({s, p}) => p.lat != null && km(p.lat, p.lng, s.lat, s.lng) > 250);
  add(far.length ? 'warn' : 'pass', 'Saved places are filed near their stop',
    far.length ? far.map(({s, p}) => `${p.name} is ${Math.round(km(p.lat, p.lng, s.lat, s.lng))} km from ${s.name}`).join('; ') : `${places.length} saved places`);

  const SAMPLES = [
    ['https://www.google.com/maps/place/Osaka+Castle/@34.6873153,135.5258117,17z/data=!3m1!4b1!4m6!3m5!1s0x6000e0cd5a4ed3e5:0x1!8m2!3d34.6873153!4d135.5262013', 'Osaka Castle', 34.6873, 135.5262],
    ['https://www.google.com/maps/search/?api=1&query=35.0394,135.7292', '', 35.0394, 135.7292],
    ['Golden Gai\nhttps://maps.google.com/?q=35.6938,139.7046', 'Golden Gai', 35.6938, 139.7046],
    ['https://www.google.com/maps/@34.3853,132.4553,14z', '', 34.3853, 132.4553],
    ['https://maps.app.goo.gl/28QK9YA48XZBVTBr9', '', null, null],
  ];
  const failed = SAMPLES.filter(([t, name, la, ln]) => { const p = parseMapsText(t); return p.name !== name || (la == null ? p.lat != null || !p.short : Math.abs(p.lat - la) > 1e-3 || Math.abs(p.lng - ln) > 1e-3); });
  add(failed.length ? 'fail' : 'pass', 'Google Maps links are read correctly', failed.length ? `failed on ${failed.map(f => f[0].slice(0, 40)).join(', ')}` : `${SAMPLES.length} link formats tested`);

  try { localStorage.setItem('__check', '1'); const ok = localStorage.getItem('__check') === '1'; localStorage.removeItem('__check');
    add(ok ? 'pass' : 'fail', 'This browser can save your changes'); }
  catch { add('fail', 'This browser can save your changes', 'storage is blocked, often by private browsing'); }
  const stored = readJSON(LS_KEY);
  add(!stored ? 'info' : stored.updatedAt === trip.updatedAt ? 'pass' : 'warn', 'Latest change is saved', !stored ? 'no changes made yet' : stored.updatedAt === trip.updatedAt ? `saved ${new Date(trip.updatedAt).toLocaleString()}` : 'the stored copy is older than what’s on screen');

  if (REMOTE) {
    try { const [row] = await rpc('get_trip', {p_key: TRIP_KEY});
      add(row ? (sync.dirty ? 'warn' : 'pass') : 'warn', 'Shared plan is in sync', !row ? 'connected, nothing shared yet' : sync.dirty ? 'your latest change hasn’t reached the shared copy yet' : `last shared save ${new Date(row.saved_at).toLocaleString()}`); }
    catch (e) { add('fail', 'Shared plan is in sync', `can’t reach the shared copy: ${e.message.slice(0, 80)}`); }
  } else add(TRIP_KEY && CONFIG.supabaseUrl ? 'warn' : 'info', 'Sharing with friends', !CONFIG.supabaseUrl ? 'not set up yet, so changes stay in this browser' : !TRIP_KEY ? 'add #trip=your-code to the page address to turn sharing on' : 'the trip code in the address needs at least 12 characters');
  if (CONFIG.resolverUrl) {
    try { const t = await (await fetch(`${CONFIG.resolverUrl}?url=${encodeURIComponent(SAMPLES[4][0])}`)).text();
      add(/google\.[a-z.]+\/maps/.test(t) ? 'pass' : 'fail', 'Short Maps links can be expanded', t.slice(0, 60)); }
    catch (e) { add('fail', 'Short Maps links can be expanded', e.message); }
  } else add('info', 'Short Maps links can be expanded', 'link expander not set up, so paste full links');
  return R;
}
function checksState(R) { return R.some(r => r.state === 'fail') ? 'fail' : R.some(r => r.state === 'warn') ? 'warn' : 'pass'; }
async function showChecks() {
  const R = await runChecks(), n = s => R.filter(r => r.state === s).length;
  $('#checks-btn').dataset.state = checksState(R);
  $('#checks-sum').textContent = `${n('pass')} passed, ${n('warn')} to look at, ${n('fail')} failed.`;
  $('#checks-list').innerHTML = R.map(r => `<li class="${r.state}"><b>${esc(r.name)}</b>${r.detail ? `<small>${esc(r.detail)}</small>` : ''}</li>`).join('');
  openDlg('#checks-dlg');
}
window.runChecks = runChecks;

// ═══ 14. START ════════════════════════════════════════════════════════════════
renderAll();
ui.view = clampView(viewAround(trip.stops.map(s => project(s.lat, s.lng)), MAP_W*.5)); renderOverlay();
setStatus(REMOTE ? 'saving' : 'local', REMOTE ? 'Connecting…' : undefined);
if (REMOTE) initRemote();
runChecks().then(R => $('#checks-btn').dataset.state = checksState(R));
</script>
</body>
