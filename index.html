<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1917">
<title>Japan trip planner</title>
<script>try { if (window.self !== window.top) document.documentElement.classList.add('embedded'); } catch { document.documentElement.classList.add('embedded'); }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c1917;--paper:#f6f1e9;--paper2:#ede8de;--line:rgba(28,25,23,.12);--line2:rgba(28,25,23,.22);--muted:#6c655e;
  --land:#ece6d8;--coast:#bfb49c;--sea:#bcd5e1;--accent:#1b4878;--ok:#1a6b3c;--warn:#a16207;--bad:#b42318;}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.45 'DM Sans',system-ui,sans-serif;color:var(--ink);background:var(--paper);display:flex;flex-direction:column;height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{border:1px solid var(--line2);border-radius:5px;background:#fff;padding:6px 8px;font-size:12.5px}

header{display:flex;align-items:center;gap:14px;padding:9px 16px;background:var(--ink);color:var(--paper);flex-wrap:wrap}
.logo{font:600 18px 'Shippori Mincho',serif;letter-spacing:.03em}
.logo small{opacity:.45;font-size:12px;margin-left:6px}
#trip-summary{font:600 15px 'Shippori Mincho',serif}
#trip-summary small{font:400 11px 'DM Sans',sans-serif;opacity:.6;margin-left:6px}
#status{font-size:11px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.1)}
#status[data-kind=synced]{background:#1f4d33}
#status[data-kind=offline]{background:#6b4a0c}
#status[data-kind=error]{background:#7a1f16}
.tools{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.tools button{background:none;border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--paper)}
.tools button:hover{background:rgba(255,255,255,.08)}
.tools button[aria-pressed=true]{background:#3a6e9a;border-color:#3a6e9a}
#checks-btn[data-state=fail]::after,#checks-btn[data-state=warn]::after{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:#f87171;margin-left:6px}
#checks-btn[data-state=warn]::after{background:#fbbf24}

.app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(330px,410px) 1fr}
.sidebar{overflow-y:auto;border-right:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--paper2);font-size:12px;color:var(--muted)}
.bar input{flex:1;min-width:0;font-size:13px}
.paste{flex-direction:column;align-items:stretch;gap:4px}
.paste label{font-weight:500;color:var(--ink)}

.leg{border-bottom:1px solid var(--line);background:#faf8f3}
.leg-head{display:flex;align-items:center;gap:10px;width:100%;padding:8px 16px;border:0;background:none;text-align:left}
.leg-head:hover{background:var(--paper2)}
.leg-icon{width:22px;text-align:center}
.leg-text{flex:1;min-width:0;display:flex;flex-direction:column;font-size:11px;color:var(--muted)}
.leg-text b{font-weight:500;color:var(--ink);font-size:12px}
.badge{font-size:10px;padding:2px 7px;border-radius:99px;background:#efe9dc;color:#7c705a;white-space:nowrap}
.badge.on{background:#d9f0e1;color:var(--ok)}
.leg-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 16px 14px}
.leg-form label,.notes{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:500;color:var(--muted)}
.leg-form .full{grid-column:1/-1}
.link{grid-column:1/-1;justify-self:start;border:0;background:none;color:var(--muted);text-decoration:underline;font-size:11px}

.stop{border-bottom:1px solid var(--line);border-left:3px solid transparent}
.stop.open{background:#efece3;border-left-color:var(--c)}
.stop.hover{background:#e7eef6}
.stop-head{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer}
.num{width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 12px 'Shippori Mincho',serif;flex-shrink:0}
.s-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.s-name{font:600 15.5px 'Shippori Mincho',serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-sub{font-size:11px;color:var(--muted)}
.s-sub em{font-style:normal;color:#7d6f4e;font-weight:500;margin-left:4px}
.name-in{font:600 14px 'Shippori Mincho',serif;padding:3px 6px}
.region-in{font-size:11px;padding:2px 6px}
.nights{display:flex;align-items:center;flex-shrink:0}
.nights button{width:24px;height:26px;border:1px solid var(--line2);background:var(--paper)}
.nights button:first-child{border-radius:5px 0 0 5px}
.nights button:last-child{border-radius:0 5px 5px 0}
.nights input{width:34px;height:26px;border-radius:0;border-width:1px 0;padding:0;text-align:center;font:600 13px 'Shippori Mincho',serif;background:var(--paper);-moz-appearance:textfield}
.nights input::-webkit-inner-spin-button{display:none}
.edit-ctl{display:flex;gap:2px}
.edit-ctl button{width:24px;height:26px;border:1px solid var(--line2);border-radius:5px;background:var(--paper);font-size:10px;color:var(--muted)}
.edit-ctl button:disabled{opacity:.35;cursor:default}
.stop-body{padding:0 16px 16px 52px}
.stop-body h4{font:600 12px 'DM Sans',sans-serif;color:var(--muted);margin:12px 0 6px}
.things{list-style:none;display:flex;flex-direction:column;gap:5px}
.things li{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 6px;font-size:13px}
.things li::before{content:'';width:5px;height:5px;border-radius:50%;background:#c0b8b0;transform:translateY(-2px)}
.things li.hl{font-weight:500}
.things li.hl::before{background:var(--c)}
.things li span{flex:1 1 60%}
.tag{font-style:normal;font-size:9.5px;padding:1px 6px;border-radius:4px}
.places{list-style:none;display:flex;flex-direction:column;gap:8px}
.places li{background:#fff;border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.side{font-style:normal;font-size:10px;color:#7c5e10;background:#fbf1d6;border-radius:4px;padding:1px 6px;white-space:nowrap;flex-shrink:0}
.pl-top{display:flex;align-items:center;gap:6px}
.pl-top a{flex:1;min-width:0;font-weight:500;color:var(--accent);text-decoration:none;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.pl-top a:hover{text-decoration:underline}
.x{border:0;background:none;color:var(--muted);width:24px;height:24px;border-radius:4px;flex-shrink:0}
.x:hover{background:#fde8e6;color:var(--bad)}
.pl-note{width:100%;margin-top:6px;border:0;border-top:1px dashed var(--line2);border-radius:0;padding:6px 0 0;font-size:12.5px;background:transparent}
.tip{margin-top:12px;padding:8px 10px;border-left:2px solid #c9a84c;background:#fdf8ec;font-size:12px;color:#6b5000}
.notes{margin-top:12px}
.notes textarea{resize:vertical;min-height:48px}
.add-stop{display:block;margin:16px;width:calc(100% - 32px);padding:10px;border:1.5px dashed var(--line2);border-radius:8px;background:none;color:var(--muted)}
.add-stop:hover{border-color:var(--accent);color:var(--accent)}

.map{position:relative;overflow:hidden;background:var(--sea);touch-action:none;display:flex;flex-direction:column}
#map{flex:1;min-height:0;width:100%;display:block;cursor:grab}
#map.dragging{cursor:grabbing}
#land path{fill:var(--land);stroke:var(--coast);stroke-width:.6;vector-effect:non-scaling-stroke}
#pins [data-sid],#places [data-sid]{cursor:pointer}
.playbar{margin:10px 12px 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:7px 11px;background:rgba(255,255,255,.95);border-radius:9px;box-shadow:0 2px 10px rgba(0,0,0,.12);font-size:12px}
.playbar button,.zoom button{min-width:28px;height:28px;border:1px solid var(--line2);border-radius:6px;background:var(--paper)}
#play[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
#day{flex:1;min-width:40px;accent-color:var(--accent);padding:0;border:0;background:none}
#day-label{min-width:0;max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:4px}
.zoom button{padding:0 9px;font-size:12px}
.legend{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.95);border-radius:8px;padding:8px 11px;font-size:11px;display:flex;flex-direction:column;gap:3px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.legend i.dot{width:8px;height:8px;border-radius:50%;margin:0 10px 0 4px;background:#888;border:1.5px solid #fff}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);padding:6px 10px;border-radius:6px;font-size:12px;transform:translate(-50%,calc(-100% - 14px));opacity:0;transition:opacity .1s;white-space:nowrap}
#tip.on{opacity:1}
@keyframes bob{50%{transform:translateY(-4px)}}
.bob{animation:bob .9s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob{animation:none}}

dialog{margin:auto;border:0;border-radius:12px;padding:20px;width:min(460px,92vw);background:var(--paper);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(28,25,23,.45)}
dialog h3{font:600 18px 'Shippori Mincho',serif}
dialog form{display:flex;flex-direction:column;gap:10px}
dialog label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--muted)}
dialog textarea.json{min-height:200px;font:11px ui-monospace,monospace}
.muted{color:var(--muted);font-size:12.5px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.actions button{padding:7px 14px;border-radius:6px;border:1px solid var(--line2);background:var(--paper)}
.actions .primary{background:var(--accent);border-color:var(--accent);color:#fff}
.checks{list-style:none;display:flex;flex-direction:column;gap:7px;max-height:58vh;overflow:auto}
.checks li{display:grid;grid-template-columns:18px 1fr;gap:1px 8px;font-size:12.5px}
.checks li::before{font-weight:700;text-align:center}
.checks .pass::before{content:'✓';color:var(--ok)}
.checks .warn::before{content:'!';color:var(--warn)}
.checks .fail::before{content:'✕';color:var(--bad)}
.checks .info::before{content:'i';color:var(--muted)}
.checks small{grid-column:2;color:var(--muted)}
#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,16px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:7px;font-size:12.5px;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.undo{pointer-events:auto;display:flex;align-items:center;gap:12px}
#toast button{border:1px solid rgba(255,255,255,.35);background:none;color:var(--paper);border-radius:5px;padding:3px 10px;font-size:12px}
.pl-toggle{display:flex;align-items:center;gap:8px;width:100%;margin:14px 0 6px;padding:7px 10px;border:1px solid var(--line2);border-radius:7px;background:#fff;text-align:left}
.pl-toggle b{font-weight:600;font-size:12.5px}
.pl-counts{flex:1;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{font-size:10px;color:var(--muted);transition:transform .15s}
.pl-toggle[aria-expanded=true] .chev{transform:rotate(180deg)}
.stop-body h5{font:600 11.5px 'DM Sans',sans-serif;color:var(--ink);margin:10px 0 5px}
.pl-meta{display:flex;gap:6px;margin-top:5px}
.pl-meta select{font-size:11px;padding:2px 4px;flex:1;min-width:0}
.things li .x{width:20px;height:20px;font-size:10px;opacity:.55}
.things li .x:hover{opacity:1}

.tabs{display:flex;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none;background:rgba(255,255,255,.08);border-radius:7px;padding:3px}
.tabs button{white-space:nowrap;flex:none;border:0;background:none;color:rgba(246,241,233,.65);border-radius:5px;padding:4px 11px;font-size:12.5px}
.tabs button[aria-pressed=true]{background:var(--paper);color:var(--ink);font-weight:500}
.tabs small{opacity:.6;margin-left:4px}
.ideas{display:none;flex:1;min-height:0;overflow-y:auto;padding:18px clamp(12px,3vw,32px) 40px}
body[data-page=ideas] .app{visibility:hidden;position:fixed;inset:0;z-index:-1;pointer-events:none}   /* kept laid out so map checks still work */
body[data-page=ideas] .ideas{display:block}
/* Pre-trip checklist: full page, shared with everyone on the plan */
.checklist{display:none;flex:1;min-height:0;overflow-y:auto;padding:22px clamp(16px,3vw,32px) 48px}
body[data-page=checklist] .app{visibility:hidden;position:fixed;inset:0;z-index:-1;pointer-events:none}
body[data-page=checklist] .checklist{display:block}
.ck-wrap{max-width:640px;margin:0 auto}
.ck-wrap h2{font-size:20px;margin:0 0 4px}
.ck-sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.ck-progress{height:6px;border-radius:99px;background:rgba(0,0,0,.08);overflow:hidden;margin-bottom:18px}
.ck-progress span{display:block;height:100%;background:var(--ok);transition:width .2s}
.ck-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ck-item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:start;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:9px;padding:10px 12px}
.ck-item input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;accent-color:var(--ok)}
.ck-item .ck-text{font-weight:500;font-size:14px;border:0;background:none;padding:0;width:100%;font:inherit;font-weight:500}
.ck-item .ck-note{grid-column:2;font-size:12.5px;color:var(--muted);border:0;background:none;padding:0;width:100%;font:inherit;font-size:12.5px;resize:vertical;line-height:1.4;field-sizing:content;min-height:1.4em}
.ck-item.done .ck-text{text-decoration:line-through;color:var(--muted)}
.ck-item .x{opacity:.5}.ck-item .x:hover{opacity:1}
.ck-add{display:flex;gap:8px;margin-top:14px}
.ck-group{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.ck-item{grid-template-columns:auto 1fr auto auto}
.ck-item .ck-note{grid-column:2/5}
.ck-who{font-size:12px;padding:2px 4px;max-width:96px}
/* Budget: full page, lines live in their own database table */
.budget{display:none;flex:1;min-height:0;overflow-y:auto;padding:22px clamp(16px,3vw,32px) 56px}
body[data-page=budget] .app{visibility:hidden;position:fixed;inset:0;z-index:-1;pointer-events:none}
body[data-page=budget] .budget{display:block}
.bd-wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.bd-head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between}
.bd-head h2{font:600 22px 'Shippori Mincho',serif}
.bd-settings{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:12px;color:var(--muted)}
.bd-settings label{display:flex;gap:6px;align-items:center}
.bd-settings input{width:86px}.bd-settings input.wide{width:180px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{border:0;background:#fff;padding:4px 10px;font-size:12px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.bd-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi small{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.kpi b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi span{font-size:11.5px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:rgba(0,0,0,.06)}
.stack i{display:block;height:100%}
.stack i+i{border-left:2px solid #fff}
.bd-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h3{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h3 small{font-weight:400;color:var(--muted);font-size:12px}
.card + .card{margin-top:18px}
.brk{display:grid;grid-template-columns:minmax(90px,1.1fr) minmax(60px,2fr) auto;gap:6px 12px;align-items:center;font-size:12.5px}
.brk .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brk .nm small{color:var(--muted);margin-left:4px}
.brk .amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.brk .amt small{display:block;color:var(--muted);font-size:11px}
.legend-row{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted);margin-bottom:10px}
.legend-row span{display:flex;align-items:center;gap:5px}
.mini{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.mini li{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mini li b{font-variant-numeric:tabular-nums;white-space:nowrap}
.mini .sub{color:var(--muted);font-size:11.5px}
.mini button{font-size:11.5px;border:1px solid var(--line2);background:#fff;border-radius:5px;padding:2px 8px}
.empty{color:var(--muted);font-size:12.5px}
.bd-add{display:grid;grid-template-columns:minmax(140px,2fr) 100px 70px minmax(110px,1fr) minmax(110px,1fr) auto;gap:8px}
.bd-add > *{min-width:0}
.bd-add button{border:0;background:var(--accent);color:#fff;border-radius:6px;padding:6px 14px}
.bd-filters{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.bd-filters button{border:1px solid var(--line2);background:#fff;border-radius:99px;padding:3px 10px;font-size:12px}
.bd-filters button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bd-group{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px;display:flex;justify-content:space-between}
.bl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:9px 4px}
.bl:hover{background:var(--paper)}
.bl .t{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl .m{grid-column:2;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl .a{grid-row:1/3;grid-column:3;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.bl .a small{display:block;color:var(--muted);font-size:11px}
.bl .ic{grid-row:1/3;font-size:16px;width:24px;text-align:center}
.pill{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:99px;margin-right:6px;vertical-align:1px;color:#fff}
.bl.repay .t{color:var(--muted)}
#bl-dlg .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#bl-dlg .actions{display:flex;gap:8px;justify-content:flex-end}
#bl-dlg .actions .del{margin-right:auto;color:var(--bad)}
@media (max-width:820px){.bd-grid{grid-template-columns:1fr}.bd-add{grid-template-columns:1fr 1fr}.bd-add input:first-child{grid-column:1/3}}

.ck-add input{flex:1}
/* Proposals: the map stays, the sidebar swaps for the review panel */
.prop-panel{display:none}
body[data-page=changes] .app > .sidebar:not(.prop-panel){display:none}
body[data-page=changes] .prop-panel{display:block}
body[data-page=changes] .playbar{display:none}
.prop-panel{padding:16px 16px 40px;background:var(--paper)}
.prop-empty{color:var(--muted);font-size:13px;padding:8px 0}
.prop{display:flex;flex-direction:column;gap:14px}
.prop-kicker{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prop-state{font-size:10.5px;letter-spacing:.04em;padding:2px 8px;border-radius:99px;background:#fdf1d8;color:#7a5200}
.prop-state[data-s=accepted]{background:#dcefe2;color:var(--ok)}
.prop-state[data-s=dismissed]{background:var(--paper2);color:var(--muted)}
.prop h2{font:600 21px/1.25 'Shippori Mincho',serif;text-wrap:balance}
.prop p{font-size:13px;line-height:1.5;color:#403a35}
.prop ul.why{display:flex;flex-direction:column;gap:5px;padding-left:16px;font-size:12.5px;color:#403a35;line-height:1.45}
.prop-totals{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:9px;font-size:12.5px}
.prop-totals b{font:600 15px 'Shippori Mincho',serif}
.prop-totals .delta{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;background:#fdf1d8;color:#7a5200}
.prop-totals .delta.down{background:#dcefe2;color:var(--ok)}
.prop-view{display:flex;gap:2px;background:var(--paper2);border-radius:7px;padding:3px;align-self:flex-start}
.prop-view button{border:0;background:none;border-radius:5px;padding:4px 12px;font-size:12px;color:var(--muted)}
.prop-view button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp h3,.prop h3{font:600 11px 'DM Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.cmp ol{list-style:none;display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.cmp li{display:grid;grid-template-columns:10px 1fr auto;gap:6px;align-items:baseline;min-width:0}
.cmp li i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.cmp li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp li em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;font-size:11.5px}
.cmp li.gone span{text-decoration:line-through;color:var(--muted)}
.cmp li.new span{font-weight:600}
.chg{list-style:none;display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.chg li{display:grid;grid-template-columns:22px 1fr;gap:2px 8px;padding:8px 10px;background:#fff;font-size:12.5px;line-height:1.4}
.chg li > b{grid-row:span 2;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--paper2);color:var(--ink)}
.chg li[data-k=add] > b{background:#dcefe2;color:var(--ok)}
.chg li[data-k=remove] > b{background:#fbe1dd;color:var(--bad)}
.chg li[data-k=warn] > b{background:#fdf1d8;color:var(--warn)}
.chg li small{grid-column:2;color:var(--muted);font-size:11.5px}
.prop-note{font-size:12px;color:var(--muted);line-height:1.45}
.prop-actions{display:flex;flex-wrap:wrap;gap:8px;position:sticky;bottom:0;padding:10px 0 2px;background:linear-gradient(transparent,var(--paper) 30%)}
.prop-actions button{padding:9px 16px;border-radius:7px;border:1px solid var(--line2);background:#fff;font-weight:500}
.prop-actions .primary{background:var(--accent);border-color:var(--accent);color:#fff}
.prop-actions .primary:hover{background:#163c66}
#roads .rd-nat{stroke:#fffaf2;stroke-width:1.6px;vector-effect:non-scaling-stroke;opacity:.9}
#roads .rd-exp{stroke:#4f8f62;stroke-width:2.4px;vector-effect:non-scaling-stroke;opacity:.85}
.prop-vars{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prop-vars button{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--line2);background:#fff;border-radius:9px;padding:9px 11px}
.prop-vars button b{font:600 14px 'Shippori Mincho',serif}
.prop-vars button small{font-size:11.5px;line-height:1.4;color:var(--muted)}
.prop-vars button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.prop-vars button:disabled{opacity:.45}
.prop-days{list-style:none;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--line);gap:1px}
.prop-days li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:9px 11px;background:#fff}
.pd-date{font:600 12px 'DM Sans',sans-serif;color:var(--muted);line-height:1.3;padding-top:1px}
.pd-body{display:flex;flex-direction:column;gap:3px;min-width:0;font-size:12.5px}
.pd-body b{font-weight:600}
.pd-drive{align-self:flex-start;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;background:#f6edd6;color:#6b500f}
.pd-body p{font-size:12.5px;line-height:1.45;color:#403a35}
.pd-body small{font-size:11.5px;color:var(--muted)}
.prop-archive{margin-top:28px;border-top:1px solid var(--line);padding-top:12px}
.prop-archive summary{cursor:pointer;font:600 12px 'DM Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.prop-archive summary small{text-transform:none;letter-spacing:0;font-weight:400;font-size:12px}
.prop-archive-list{margin-top:14px;opacity:.85}
@media (max-width:520px){.prop-vars{grid-template-columns:1fr}}
.ideas-bar{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;max-width:1200px}
.src-switch{display:flex;gap:6px;flex-wrap:wrap}
.src-switch button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--line2);background:#fff;border-radius:9px;padding:8px 14px;min-width:170px;text-align:left}
.src-switch button b{font:600 14px 'Shippori Mincho',serif}
.src-switch button small{font-size:11.5px;color:var(--muted)}
.src-switch button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.idea .near{font-size:12px;color:var(--muted)}
.ideas-bar input[type=search]{max-width:360px;font-size:13px;padding:7px 10px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:99px;padding:3px 11px;font-size:12px;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip-lbl{font-size:11.5px;color:var(--muted);align-self:center;margin-right:2px;min-width:44px}
.ideas-sum{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.idea-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;max-width:1200px}
.idea{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 14px;display:flex;flex-direction:column;gap:7px}
.idea.is-hidden{opacity:.5}
.idea-tags{display:flex;flex-wrap:wrap;gap:4px}
.idea-tags span{font-size:10.5px;padding:1px 7px;border-radius:4px;background:var(--paper2);color:var(--muted)}
.idea-tags .where{background:#e3ecf6;color:var(--accent);font-weight:500}
.idea h3{font:600 15px/1.3 'Shippori Mincho',serif}
.idea p{font-size:12.5px;color:#403a35;line-height:1.45}
.idea-items{list-style:none;display:flex;flex-direction:column;gap:4px;border-top:1px dashed var(--line2);padding-top:7px}
.idea-items li{display:flex;align-items:center;gap:8px;font-size:12.5px}
.idea-items li > span{flex:1;min-width:0}
.plus{width:28px;height:28px;flex-shrink:0;border-radius:50%;border:1px solid var(--accent);background:#fff;color:var(--accent);font-size:17px;line-height:1}
.plus:hover{background:var(--accent);color:#fff}
.inplan{font-size:11px;color:var(--ok);font-weight:500;white-space:nowrap}
.idea footer{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:4px;font-size:11.5px;color:var(--muted)}
.idea footer a{color:var(--accent);text-decoration:none}
.idea footer a:hover{text-decoration:underline}
.idea footer .hide{margin-left:auto;border:0;background:none;color:var(--muted);font-size:11.5px;text-decoration:underline}
.bookings{display:flex;flex-direction:column;gap:7px;margin:10px 0 4px}
.bk{background:#fff;border:1px solid var(--line);border-left:3px solid var(--c, var(--accent));border-radius:7px;padding:8px 10px;font-size:12.5px}
.bk-top{display:flex;align-items:center;gap:7px}
.bk-top b{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk-meta{color:#4b453f;margin-top:4px;line-height:1.5}
.bk-meta code{font:600 12px ui-monospace,monospace;background:var(--paper2);padding:1px 5px;border-radius:4px;letter-spacing:.03em}
.bk-actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.bk-actions a,.bk-actions button{font-size:11.5px;padding:3px 9px;border:1px solid var(--line2);border-radius:5px;background:var(--paper);color:var(--ink);text-decoration:none}
.bk-actions a:hover,.bk-actions button:hover{background:var(--paper2)}
.leg .bookings{grid-column:1/-1;margin:0}
.clip{font-size:10.5px;color:var(--muted);white-space:nowrap}
.bar.upload label.btn{border:1px solid var(--line2);background:#fff;border-radius:6px;padding:6px 10px;font-size:12.5px;color:var(--ink);cursor:pointer;font-weight:500}
.bar.upload label.btn:hover{border-color:var(--accent);color:var(--accent)}
#drop-hint{position:fixed;inset:0;z-index:40;background:rgba(27,72,120,.18);border:3px dashed var(--accent);display:none;align-items:center;justify-content:center;font:600 20px 'DM Sans',sans-serif;color:var(--accent);pointer-events:none}
#drop-hint.on{display:flex}
#bk-dlg .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#bk-dlg .grid .full{grid-column:1/-1}
.menu-btn,.grip,.tabs .ti{display:none}
/* ── Phones and narrow windows ─────────────────────────────────────────────── */
@media (max-width:860px){
  body{padding-bottom:calc(58px + env(safe-area-inset-bottom))}
  /* Header: one row — name, nights, sync status, ⋯ menu */
  header{flex-wrap:nowrap;gap:10px;padding:8px 10px 8px 14px;padding-top:max(8px,env(safe-area-inset-top));position:relative;z-index:30}
  .logo{font-size:17px;white-space:nowrap}
  .logo small,#trip-summary small{display:none}
  #trip-summary{font-size:14px;white-space:nowrap;opacity:.85}
  #status{margin-left:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .menu-btn{display:flex;align-items:center;justify-content:center;flex:none;width:40px;height:36px;border:1px solid rgba(255,255,255,.22);border-radius:8px;background:none;color:var(--paper);font-size:20px;line-height:1}
  .menu-btn[aria-expanded=true]{background:rgba(255,255,255,.14)}
  .tools{display:none;position:absolute;top:100%;right:8px;margin:0;width:min(240px,calc(100vw - 16px));flex-direction:column;flex-wrap:nowrap;gap:2px;padding:6px;background:var(--ink);border-radius:0 0 12px 12px;box-shadow:0 14px 30px rgba(0,0,0,.35)}
  header.menu-open .tools{display:flex}
  .tools button{border:0;border-radius:8px;padding:12px 14px;font-size:15px;text-align:left;white-space:nowrap}
  /* Tabs become a bottom bar, where thumbs reach */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:35;max-width:none;overflow:visible;gap:0;border-radius:0;background:var(--ink);padding:5px 4px calc(5px + env(safe-area-inset-bottom));box-shadow:0 -1px 0 rgba(255,255,255,.06)}
  .tabs button{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 0 2px;font-size:11px;background:none!important;color:rgba(246,241,233,.62)}
  .tabs button[aria-pressed=true]{color:#fff;font-weight:600}
  .tabs .ti{display:block;width:46px;height:28px;padding:4px 12px;border-radius:99px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:background .15s}
  .tabs button[aria-pressed=true] .ti{background:rgba(255,255,255,.16)}
  .tabs small{position:absolute;top:0;left:calc(50% + 9px);margin:0;opacity:1;font-size:9.5px;font-weight:600;line-height:15px;padding:0 5px;border-radius:99px;background:#3a3531;color:var(--paper)}
  .tabs small:empty{display:none}
  /* Plan + Proposals: map on top, list below, grab handle in between */
  .app{display:flex;flex-direction:column}
  .map{order:0;flex:none;height:var(--map-h,40dvh);transition:height .22s ease}
  .app.resizing .map{transition:none}
  .grip{display:flex;order:1;flex:none;position:relative;align-items:center;justify-content:center;gap:8px;height:24px;background:var(--paper);border-top:1px solid var(--line);touch-action:none;cursor:row-resize;user-select:none;-webkit-user-select:none}
  .grip span{width:42px;height:5px;border-radius:99px;background:var(--line2)}
  .grip b{display:none;font-size:12px;font-weight:500;color:var(--muted)}
  .app.map-hidden .grip{height:34px}
  .app.map-hidden .grip b{display:inline}
  .sidebar{order:2;flex:1;min-height:0;border:0}
  .legend{display:none}
  .playbar{margin:8px 8px 0;padding:5px 8px;gap:6px 6px}
  .playbar button,.zoom button{min-width:36px;height:36px;font-size:15px}
  .zoom{right:8px;bottom:8px}
  .zoom button[data-action=fit]{font-size:13px}
  #day-label{max-width:none;flex-basis:100%;font-size:11.5px}
  .app.map-small .playbar{display:none}
  /* Bigger targets for fingers */
  .stop-head{padding:13px 14px}
  .things li .x{width:32px;height:32px;font-size:12px}
  .bar.upload span:last-child{display:none}
  .prop-actions{background:var(--paper);margin:0 -16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 12px var(--paper)}
  .prop-actions button{flex:1;padding:12px 14px}
  /* Ideas: filters scroll sideways instead of filling the screen */
  .ideas{padding:14px 12px 32px}
  .src-switch{flex-wrap:nowrap}
  .src-switch button{flex:1 1 0;min-width:0;padding:8px 12px}
  .ideas-bar input[type=search]{max-width:none}
  .ideas .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px 2px}
  .ideas .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:7px 13px;font-size:13px}
  .chip-lbl{flex:none;min-width:0}
  .idea-grid{grid-template-columns:1fr}
  /* Checklist: name gets the full row; who-does-it sits under the note */
  .checklist{padding:18px 12px 32px}
  .ck-item{grid-template-columns:auto minmax(0,1fr) auto;padding:12px}
  .ck-item input[type=checkbox]{width:22px;height:22px}
  .ck-item .x{grid-column:3;grid-row:1;width:32px;height:32px}
  .ck-item .ck-note{grid-column:2/4}
  .ck-item .ck-who{grid-column:2;grid-row:3;justify-self:start;max-width:none;margin-top:4px}
  /* Budget */
  .budget{padding:18px 12px 32px}
  .bd-kpis{grid-template-columns:1fr 1fr}
  .seg button{padding:8px 12px}
  .bd-filters button{padding:6px 12px;font-size:13px}
  .bl{padding:12px 4px}
  /* Dialogs slide up from the bottom */
  dialog{width:100%;max-width:none;margin:auto 0 0;border-radius:16px 16px 0 0;max-height:92dvh;overflow-y:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
  dialog button{min-height:40px}
  #toast{bottom:calc(72px + env(safe-area-inset-bottom));max-width:calc(100vw - 24px)}
}
/* Embedded in another site (the Squarespace page): the frame's bottom edge can sit below the screen,
   so on phones the tabs go under the header instead, where they're always visible */
@media (max-width:860px){
  html.embedded body{padding-bottom:0}
  html.embedded header{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:6px 10px;padding-top:8px}
  html.embedded #status{justify-self:end;max-width:100%}
  html.embedded .tabs{position:static;order:5;grid-column:1/-1;padding:2px 0 0;background:none;box-shadow:none}
  html.embedded .tabs .ti{width:40px;height:24px;padding:3px 10px}
  html.embedded #toast{bottom:16px}
  html.embedded .prop-actions{padding-bottom:10px}
}
/* Short screens and short embeds: playback bar on one row so the map keeps its room */
@media (max-width:860px) and (max-height:760px){
  .playbar{flex-wrap:nowrap;padding:4px 6px}
  .playbar [data-action=step]{display:none}
  #day-label{flex:0 1 50%;flex-basis:auto;font-size:11px}
}
/* Phones zoom the page when a text box under 16px gets focus — stop that */
@media (max-width:860px) and (pointer:coarse){
  input,select,textarea{font-size:16px!important}
}

<body>
<header>
  <div class="logo">Japan trip<small>日本の旅</small></div>
  <nav class="tabs" aria-label="Pages">
    <button data-action="page" data-v="plan" aria-pressed="true"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>Plan</button>
    <button data-action="page" data-v="ideas" aria-pressed="false"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3Z"/></svg>Ideas<small id="ideas-count"></small></button>
    <button data-action="page" data-v="changes" aria-pressed="false"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v10a4 4 0 0 0 4 4h6"/><path d="m14 15 3 3-3 3"/><circle cx="7" cy="4" r="1.5"/></svg>Proposals<small id="prop-count"></small></button>
    <button data-action="page" data-v="checklist" aria-pressed="false"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 7 2 2 4-4M4 16l2 2 4-4M13 7h7M13 16h7"/></svg>Checklist<small id="ck-count"></small></button>
    <button data-action="page" data-v="budget" aria-pressed="false"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>Budget<small id="bd-count"></small></button>
  </nav>
  <div id="trip-summary"></div>
  <div id="status" data-kind="local" role="status"></div>
  <button id="menu-btn" class="menu-btn" data-action="menu" aria-expanded="false" aria-controls="tools" aria-label="More actions">⋯</button>
  <div class="tools" id="tools">
    <button id="edit-btn" data-action="toggle-edit" aria-pressed="false">Edit stops</button>
    <button id="checks-btn" data-action="checks">Checks</button>
    <button data-action="copy">Copy plan</button>
    <button data-action="import">Load plan</button>

</header>

<div class="app">
  <aside class="sidebar">
    <div class="bar">
      <span>Start date</span>
      <input type="date" id="start-date" data-bind="startDate" data-rerender style="flex:0 1 auto">
      <span id="end-date"></span>
    </div>

      <span>Add a booking</span>
      <label class="btn" for="bk-file">Upload PDF</label>
      <input type="file" id="bk-file" accept="application/pdf,.pdf" multiple hidden>
      <span>or drop PDFs on the page</span>
    </div>
    <div class="bar paste">
      <label for="paste-in">Add a place</label>
      <input id="paste-in" placeholder="Paste a Google Maps link, then press Enter" autocomplete="off">

  </aside>
  <aside class="sidebar prop-panel" id="prop-panel" aria-label="Proposed changes to the plan"></aside>

  <main class="map">
    <div class="playbar">
      <button data-action="step" data-d="-1" aria-label="Previous day">‹</button>
      <button id="play" data-action="play" aria-pressed="false" aria-label="Play through the trip">▶</button>

      <button data-action="step" data-d="1" aria-label="Next day">›</button>
      <span id="day-label">Scrub through the trip day by day</span>
    </div>

const MAP_W = 1000, MAP_H = 846;

// Brings any saved plan (including the older V1 format) into the current shape. Safe to run repeatedly.
function normalize(t) {
  if (!t || !Array.isArray(t.stops) || !t.stops.length) return null;
  t.stops.forEach((s, i) => {
    if (s.tabs && !s.sections) s.sections = s.tabs.map(tb => ({label: tb.label, items: tb.items || []}));
    ['tabs','skiPicker','skiOptions','skiChoice','num','days'].forEach(k => delete s[k]);
    s.id ||= uid(); s.sections ||= []; s.places ||= [];
    s.places.forEach(p => { p.id ||= uid(); p.note ??= ''; if (!CATS.some(c => c.id === p.cat)) p.cat = classify(p.name, p.note); });
    s.sections = s.sections.filter(sec => (sec.items || []).length); s.notes ??= ''; s.tip ??= ''; s.prefIds ||= [];
    s.color ||= PALETTE[i % PALETTE.length];
    s.nights = clamp(Number.isFinite(parseInt(s.nights)) ? parseInt(s.nights) : 1, 0, 30);   // 0 = a day stop, no night there
    if (i === 0) delete s.leg; else s.leg = {...leg('train'), ...(s.leg || {})};
  });
  t.version = 2; t.startDate ||= ''; t.imports ||= []; t.hiddenIdeas ||= []; t.bookings ||= [];
  if (!Array.isArray(t.checklist)) t.checklist = structuredClone(CHECKLIST_START);
  t.seeded ||= [];
  if (!t.seeded.includes('pretrip-sheet')) {   // the Pre-Trip tab of the group's spreadsheet, added once
    const have = new Set(t.checklist.map(c => c.id));
    t.checklist.push(...structuredClone(CHECKLIST_SHEET.filter(c => !have.has(c.id))));
    t.checklist.forEach(c => { if (!c.cat) c.cat = {'ck-cash': 'Finances', 'ck-suica': 'Transit'}[c.id] || ''; });
    t.seeded.push('pretrip-sheet');
  }
  t.checklist.forEach(c => { c.id ||= uid(); c.text ??= ''; c.note ??= ''; c.cat ??= ''; c.who ??= ''; c.done = Boolean(c.done); });
  t.budget = {rate: 210, travellers: ['Miguel', 'Vid', 'Sam'], target: 0, ...(t.budget || {})};
  if (!t.proposals || typeof t.proposals !== 'object' || Array.isArray(t.proposals)) t.proposals = {};   // {id: {status, at, previous}}
  const targets = new Set(t.stops.flatMap((s, i) => [`stop:${s.id}`, ...(i ? [`leg:${s.id}`] : [])]));
  t.bookings.forEach(b => { if (!targets.has(b.attach)) b.attach = `stop:${t.stops[0].id}`; });   // its stop was removed
  return t;
}

    else if (!row) { sync.base = null; await push(); }                      // first person: upload this plan
    else if (sync.dirty && sync.base === row.saved_at) await push();         // our offline edits are the newest

const MAPS_RE = /(google\.[a-z.]+\/maps|maps\.google\.|maps\.app\.goo\.gl|goo\.gl\/maps)/i;
// Reads a place name and coordinates out of pasted text. Works on full links; short

function parseMapsText(text) {
  const url = (String(text).match(/https?:\/\/[^\s<>"]+/) || [''])[0];
  const out = {url, name: String(text).replace(url, '').trim().split('\n')[0].trim(), lat: null, lng: null, short: false};
  if (!url) return out;
  if (/^https?:\/\/(maps\.app\.goo\.gl|goo\.gl\/maps)\//i.test(url)) { out.short = true; return out; }
  let d; try { d = decodeURIComponent(url.replace(/\+/g, ' ')); } catch { d = url; }
  const n = '(-?\\d{1,3}\\.\\d+)';
  const m = d.match(new RegExp(`!3d${n}!4d${n}`))                                // exact pin
        || d.match(new RegExp(`[?&](?:q|query|ll|center|destination)=${n},\\s*${n}`)) // coordinates in the query
        || d.match(new RegExp(`@${n},${n}`));                                     // map view centre
  if (m) { out.lat = +m[1]; out.lng = +m[2]; }
  const place = d.match(/\/maps\/place\/([^/@?]+)/) || d.match(/[?&](?:q|query)=([^&]+)/);
  if (place && !/^\s*-?\d+\.\d+\s*,/.test(place[1])) out.name = place[1].trim() || out.name;
  return out;
}

    else if (m[13]) push(m[15].length === 2 ? 2000 + +m[15] : +m[15], MONTHS[m[14].toLowerCase()], +m[13]);   // airline style: 15NOV26

}

  const flights = [...new Set([...t.matchAll(new RegExp(`\\b(${CARRIERS})\\s?(\\d{1,4})\\b`, 'g'))].map(m => `${m[1]} ${m[2]}`))];
  const trains = [...new Set([...t.matchAll(/\b(Nozomi|Hikari|Kodama|Mizuho|Sakura|Tsubame|Hayabusa|Komachi|Kagayaki|Hakutaka)\s*(?:No\.?\s*)?(\d{1,4})\b/gi)].map(m => `${m[1][0].toUpperCase()}${m[1].slice(1).toLowerCase()} ${m[2]}`))];
  const airports = [...new Set([...t.matchAll(/\(([A-Z]{3})\)|\b([A-Z]{3})\s*(?:→|->|–|—|to)\s*([A-Z]{3})\b/g)].flatMap(m => [m[1], m[2], m[3]]).filter(c => c && AIRPORTS[c]))];
  const times = [...t.matchAll(/\b([01]?\d|2[0-3]):([0-5]\d)\b/g)].map(m => `${m[1].padStart(2, '0')}:${m[2]}`);
  const labelled = label => { const i = t.search(new RegExp(label, 'i')); return i < 0 ? '' : isoDates(t.slice(i, i + 120))[0] || ''; };
  const checkIn = labelled('check-?in'), checkOut = labelled('check-?out'), all = isoDates(t);
  // a stay's own dates beat any others in the text (cancellation deadlines, booking date…)
  const dates = checkIn ? [...new Set([checkIn, checkOut].filter(Boolean))].sort() : [...new Set(all)].sort();
  let names = one(/(?:passenger(?: name)?s?|guest(?: name)?s?|lead (?:guest|traveller|traveler)|traveller(?: name)?|traveler(?: name)?|name of guest|customer name|booked by|participant(?: name)?s?)\s*[:\n]\s*([A-Za-z][A-Za-z'\-\/]+(?:[ \/][A-Za-z][A-Za-z'\-]+){0,3})/i);

  if (!names) names = one(/\b([A-Z]{2,}\/[A-Z]{2,}(?:\s(?:MR|MRS|MS|MISS|DR))?)\b/);
  const price = one(/(?:total(?: price| amount| paid| cost)?|amount paid|grand total|price)\s*[:\n]?\s*((?:¥|JPY|US\$|A\$|AU\$|\$|€|£|AUD|USD)\s?[\d,]+(?:\.\d{2})?|[\d,]+(?:\.\d{2})?\s?(?:JPY|円|yen|AUD|USD))/i);
  const address = one(/(?:address|住所)\s*[:\n]\s*([^\n]{8,120})/i);
  const hotel = one(/(?:property|hotel|accommodation|where you(?:'|’)re staying)\s*(?:name)?\s*[:\n]\s*([^\n]{3,80})/i)
    || (t.split('\n').find(l => /\b(hotel|inn|ryokan|hostel|resort|apartment|suites?|stay)\b/i.test(l) && l.length < 70 && !/check|policy|address|booking|confirm/i.test(l)) || '');
  const activity = one(/(?:activity|product|ticket|experience|tour|package)\s*(?:name)?\s*[:\n]\s*([^\n]{3,80})/i);
  const kind = prov?.kind || (flights.length || airports.length >= 2 ? 'flight' : trains.length || /shinkansen|train|platform|car no/i.test(t) ? 'train'
    : checkIn || /check-?in|nights?\b|room/i.test(t) ? 'stay' : /ticket|admission|tour|activity|voucher|entry/i.test(t) ? 'activity' : 'other');
  const route = airports.length >= 2 ? `${airports[0]} → ${airports[1]}` : '';
  const title = kind === 'flight' ? [prov?.label, flights[0], route].filter(Boolean).join(' ')
    : kind === 'train' ? [trains[0] || 'Train', route].filter(Boolean).join(' ')
    : kind === 'stay' ? hotel || prov?.label || 'Stay'
    : activity || fileName.replace(/\.pdf$/i, '').replace(/[_-]+/g, ' ') || 'Booking';
  return {kind, provider: prov?.label || '', providerUrl: prov?.url || '', title: title.trim(), ref, names, dates, times: times.slice(0, 4),
    number: (kind === 'train' ? trains[0] : flights[0]) || '', airports, price, address: address || '', empty: t.trim().length < 20};
}
// Which stop or leg a booking belongs to: airports/cities in the text, then dates, then the open stop.
const CITY_WORDS = {tokyo:['tokyo','shinjuku','shibuya','ginza','haneda','narita','asakusa'], sapporo:['sapporo','hokkaido','chitose','niseko'], fukuoka:['fukuoka','hakata','nagasaki'],
  nagasaki:['nagasaki'], hiroshima:['hiroshima','miyajima'], osaka:['osaka','namba','umeda','kobe','kansai'], kobe:['kobe'], kyoto:['kyoto','gion','arashiyama'], nara:['nara'], okinawa:['okinawa','naha']};
const stopCity = s => Object.keys(CITY_WORDS).filter(c => CITY_WORDS[c].some(w => `${s.name} ${s.region}`.toLowerCase().includes(w)));
function suggestAttach(b, text) {
  const lc = text.toLowerCase();
  if (b.kind === 'flight' || b.kind === 'train') {
    // origin and destination: airport codes, or else city names in the order they appear (e.g. "Hiroshima … Shin-Osaka")
    const seq = Object.keys(CITY_WORDS).map(c => [c, Math.min(...CITY_WORDS[c].map(w => { const k = lc.indexOf(w); return k < 0 ? Infinity : k; }))])
      .filter(([, k]) => k < Infinity).sort((x, y) => x[1] - y[1]).map(([c]) => c);
    const [a, z] = b.airports.length >= 2 ? b.airports.map(c => AIRPORTS[c]) : seq;
    const legs = trip.stops.map((s, i) => ({s, i})).slice(1);
    const hit = (a && z && legs.find(({s, i}) => stopCity(trip.stops[i - 1]).includes(a) && stopCity(s).includes(z)))
      || (trip.startDate && b.dates[0] && legs.find(({i}) => ymd(dateAt(nightsBefore(i))) === b.dates[0]))
      || (z && legs.find(({s}) => stopCity(s).includes(z)));
    if (hit) return `leg:${hit.s.id}`;
  }
  if (trip.startDate && b.dates[0]) {
    const i = trip.stops.findIndex((s, k) => b.dates[0] >= ymd(dateAt(nightsBefore(k))) && b.dates[0] < ymd(dateAt(nightsBefore(k) + s.nights)));
    if (i >= 0) return `stop:${trip.stops[i].id}`;
  }
  const score = s => stopCity(s).reduce((n, c) => n + CITY_WORDS[c].reduce((m, w) => m + (lc.split(w).length - 1), 0), 0);
  const best = [...trip.stops].sort((x, y) => score(y) - score(x) || y.nights - x.nights)[0];
  return score(best) ? `stop:${best.id}` : `stop:${ui.openStop || trip.stops[0].id}`;
}

// File storage
const idb = () => new Promise((ok, fail) => { const r = indexedDB.open('japanTripFiles', 1); r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => ok(r.result); r.onerror = () => fail(r.error); });
const idbDo = (mode, fn) => idb().then(db => new Promise((ok, fail) => { const tx = db.transaction('files', mode), req = fn(tx.objectStore('files')); tx.oncomplete = () => ok(req?.result); tx.onerror = () => fail(tx.error); }));
const toB64 = buf => { let s = '', a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode(...a.subarray(i, i + 0x8000)); return btoa(s); };
const fromB64 = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
const FILES = {
  async put(id, name, buf) {
    if (!REMOTE) return idbDo('readwrite', st => st.put({name, data: buf}, id));
    if (sync.foreign) throw new Error('this share code belongs to another trip.');
    const ok = await rpc('save_file', {p_key: TRIP_KEY, p_id: id, p_name: name, p_type: 'application/pdf', p_data: toB64(buf)});
    if (ok !== true) throw new Error('The shared plan must be saved before files can be added.');
  },
  async get(id) {
    if (!REMOTE) { const r = await idbDo('readonly', st => st.get(id)); return r ? new Blob([r.data], {type: 'application/pdf'}) : null; }
    const [r] = await rpc('get_file', {p_key: TRIP_KEY, p_id: id}); return r ? new Blob([fromB64(r.data)], {type: 'application/pdf'}) : null;
  },
  async del(id) { if (!REMOTE) return idbDo('readwrite', st => st.delete(id)); await rpc('delete_file', {p_key: TRIP_KEY, p_id: id}); },
};

// Upload queue → read → review dialog → save
const MAX_PDF = 5 * 1024 * 1024, bkQueue = [];
function queuePdfs(list) {
  const pdfs = [...list].filter(f => /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name));
  if (!pdfs.length) return toast('Only PDF files can be added as bookings.');
  bkQueue.push(...pdfs); if (!$('#bk-dlg').open && !ui.bkBusy) nextPdf();
}
async function nextPdf() {
  const f = bkQueue.shift(); if (!f) return;
  if (f.size > MAX_PDF) { toast(`${f.name} is over 5 MB — too big to store.`); return nextPdf(); }
  ui.bkBusy = true; setStatus('saving', `Reading ${f.name}…`);
  try {
    const buf = await f.arrayBuffer(); let text = '';
    try { text = await pdfText(buf.slice(0)); } catch (e) { console.warn(e); }
    const b = extractBooking(text, f.name);
    fillBookingDialog({...b, id: uid(), fileId: uid(), fileName: f.name, size: f.size, attach: suggestAttach(b, text)}, {buf,
      info: !text ? 'Couldn’t read any text in this PDF (it may be a scan), so fill the details in by hand.' : `Read from ${f.name}. Check the details, then save.`});
  } catch (e) { toast(`Couldn’t open ${f.name}: ${e.message}`); ui.bkBusy = false; nextPdf(); }

}

async function saveBooking() {
  const {b, buf} = ui.bkPending || {}; if (!b) return;
  const v = k => $(`#bk-${k}`).value.trim();
  const rec = {...b, title: v('title') || 'Booking', kind: v('kind'), provider: v('provider'), ref: v('ref'), names: v('names'), price: v('price'), address: v('address'), number: v('number'),
    dates: v('dates').split(/[,;]\s*/).filter(Boolean), times: v('times').split(/\s*(?:→|->|,)\s*/).filter(Boolean), attach: $('#bk-attach').value};
  rec.providerUrl = PROVIDERS.find(p => p.label.toLowerCase() === rec.provider.toLowerCase())?.url || (rec.provider === b.provider ? b.providerUrl : '');

const normName = t => String(t || '').toLowerCase().normalize('NFKC').replace(/[^\p{L}\p{N}]/gu, '');

// Who owes whom, from money actually paid out so far.
function settleUp() {
  const people = trip.budget.travellers, bal = Object.fromEntries(people.map(n => [n, 0]));
  for (const l of budget.lines) {
    if (!people.includes(l.payer)) continue;
    const paid = parts(l).paid; if (!paid) continue;

function priceOf(str) {

// Saving: each line is written on its own; failed writes are retried on the next sync.
async function flushBudget() {
  if (!REMOTE || !budget.pending.size) return;
  for (const id of [...budget.pending]) {
    const l = budget.lines.find(x => x.id === id);
    try {
      const r = l ? await rpc('save_budget_line', {p_key: TRIP_KEY, p_id: id, p_data: l}) : await rpc('delete_budget_line', {p_key: TRIP_KEY, p_id: id});
      if (l && r === null) throw new Error('refused');
      budget.pending.delete(id);
    } catch (e) { console.warn('budget save', e); break; }
  }
  writeBudget();
}
async function loadBudget() {
  if (!REMOTE) return;
  await flushBudget();
  try {
    const rows = await rpc('get_budget', {p_key: TRIP_KEY});
    const mine = budget.lines.filter(l => budget.pending.has(l.id));
    const theirs = rows.filter(r => !budget.pending.has(r.id)).map(r => ({...r.data, id: r.id}));
    const next = [...theirs, ...mine.filter(l => !theirs.some(t => t.id === l.id))];
    const changed = JSON.stringify(next) !== JSON.stringify(budget.lines);
    budget.lines = next; budget.error = false; writeBudget();
    if (changed) renderBudget();
  } catch (e) { console.warn(e); budget.error = true; renderBudget(); }
}

}

async function showChecks() {
  const R = await runChecks(), n = s => R.filter(r => r.state === s).length;
  $('#checks-btn').dataset.state = checksState(R);
  $('#checks-sum').textContent = `${n('pass')} passed, ${n('warn')} to look at, ${n('fail')} failed.`;
  $('#checks-list').innerHTML = R.map(r => `<li class="${r.state}"><b>${esc(r.name)}</b>${r.detail ? `<small>${esc(r.detail)}</small>` : ''}</li>`).join('');
  openDlg('#checks-dlg');
}
window.runChecks = runChecks;

// ═══ 14. START ════════════════════════════════════════════════════════════════
renderAll();
ui.view = clampView(viewAround(trip.stops.map(s => project(s.lat, s.lng)), MAP_W*.5)); renderOverlay();
setStatus(REMOTE ? 'saving' : 'local', REMOTE ? 'Connecting…' : undefined);
if (REMOTE) initRemote(); else mergeSeeds();
setPage(['ideas', 'changes', 'checklist', 'budget'].includes(view.page) ? view.page : 'plan');
runChecks().then(R => $('#checks-btn').dataset.state = checksState(R));
</script>
</body>
</html>
